[project]
name = "pypestvis"
version = "0.1.1rc5"
description = "General vis tool for PEST++ run results"
readme = "README.md"
authors = [
    { name = "Brioch", email = "briochh@gmail.com" }
]
requires-python = ">=3.10,<3.14" #geopandas pip gdal issue on 3.14
dependencies = [
    "anywidget>=0.9.21",
    "flopy>=3.9.5",
    "geopandas>=1.1.1",
    "ipywidgets>=8.1.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "plotly>=6.4.0",
    "pyemu>=1.3.8",
    "shapely>=2.1.2",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
]
extra = [
    "jupyterlab>=4.4.10",
]

[tool.uv.sources]
 pyemu = { git = "https://github.com/pypest/pyemu", rev = "develop" }

[build-system]
requires = ["uv_build>=0.8.24,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.4.10",
    "pandas-stubs>=2.3.2.250926",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "voila>=0.5.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/pypestvis"]
parallel = true
relative_files = true
patch = ["subprocess"]
omit = [
    "*/tests/*"
    ]
